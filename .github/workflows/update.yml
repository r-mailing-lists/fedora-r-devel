name: Update Archive

on:
  schedule:
    # 01:29 UTC, off the hour like the other archives, ahead of the data build.
    - cron: '29 1 * * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Months to fetch again, space separated (for example: 2026-09 2026-10). Empty: this month and the one before.'
        type: string
        default: ''
      force:
        description: 'Replace those months even when the export has fewer messages than the copy here'
        type: boolean
        default: false

# One run at a time, as in the other archives: a run started by hand waits for the
# nightly, and the reverse.
concurrency:
  group: update-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch from the Mailman 3 archive
        env:
          MONTHS: ${{ inputs.months }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          # shellcheck disable=SC2086  # the months are words on purpose
          bash tools/update.sh $MONTHS

      - name: Download rmail-parser
        run: |
          curl -sL -o rmail-parser \
            "https://github.com/r-mailing-lists/rmail-parser/releases/latest/download/rmail-parser-linux-x86_64"
          chmod +x rmail-parser

      - name: Download aliases
        run: |
          curl -sL -o aliases.json \
            "https://raw.githubusercontent.com/r-mailing-lists/rmail-parser/main/aliases.json" \
            2>/dev/null || echo '{"aliases":[]}' > aliases.json

      - name: Parse mbox files
        run: |
          mkdir -p processed
          ./rmail-parser parse --input raw/ --output processed/ --list fedora-r-devel --aliases aliases.json
          mv processed/meta.json meta.json
          mv processed/index.json index.json
          mv processed/message-order.json message-order.json
          mv processed/contributors.json contributors.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/ processed/ meta.json index.json message-order.json contributors.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update archive $(date +%Y-%m-%d)"
            git push
          fi
          # GitHub switches off the schedule of a public repository after 60 days without
          # activity, and this list can go that long without mail. When the newest commit
          # is more than 30 days old, a one-line .heartbeat file with today's date (UTC)
          # is committed and pushed.
          LAST_COMMIT=$(git log -1 --format=%ct)
          if [ $(( $(date -u +%s) - LAST_COMMIT )) -gt $(( 30 * 86400 )) ]; then
            date -u +%F > .heartbeat
            git add .heartbeat
            git commit -m "chore: heartbeat $(date -u +%F)"
            git push
            echo "Heartbeat: the newest commit was more than 30 days old, so .heartbeat was committed"
          fi
